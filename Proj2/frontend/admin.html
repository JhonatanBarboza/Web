<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administração — Poções e Soluções</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar__brand">Poções e Soluções</div>
    <ul class="navbar__links">
      <li><a href="index.html">Loja</a></li>
      <li><a href="#">Administração</a></li>
    </ul>
  </nav>

  <main class="admin-page">
    <header>
      <h1>Painel Administrativo</h1>
      <p>Gerencie o acervo de poções da loja</p>
    </header>

    <div class="admin-grid">
      <section class="admin-form glass">
        <h2>Cadastrar Poção</h2>
        <form id="potion-form">
          <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required placeholder="Ex: Poção do Sono Profundo" />
          </div>
          <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="4" required placeholder="Descreva os efeitos da poção..."></textarea>
          </div>
          <div class="form-group">
            <label for="preco">Preço</label>
            <input type="number" id="preco" name="preco" min="0" step="0.01" required placeholder="0.00" />
          </div>
          <button type="submit" class="btn">Cadastrar Poção</button>
          <p id="form-feedback" class="form-feedback"></p>
        </form>
      </section>

      <section class="admin-list glass">
        <h2>Poções Cadastradas</h2>
        <div id="admin-list" class="admin-list__items">
          <p class="catalog__status">Carregando poções...</p>
        </div>
      </section>
    </div>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
